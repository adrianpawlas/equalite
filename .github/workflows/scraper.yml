name: Equalité Scraper

on:
  # Manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of products to scrape (leave empty for all)'
        required: false
        type: string
        default: ''
      skip_embeddings:
        description: 'Skip image/text embeddings (faster)'
        required: false
        type: boolean
        default: false
      skip_existing:
        description: 'Only scrape products not already in database'
        required: false
        type: boolean
        default: false

  # Scheduled run — every Saturday at 1:00 PM UTC
  schedule:
    - cron: '0 13 * * 6'

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model downloads (warm cache)
        run: |
          python -c "
from transformers import AutoModel, AutoProcessor
print('Downloading SigLIP model...')
AutoModel.from_pretrained('google/siglip-base-patch16-384')
AutoProcessor.from_pretrained('google/siglip-base-patch16-384')
print('Model ready')
"

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.skip_embeddings }}" = "true" ]; then
            ARGS="$ARGS --skip-embeddings"
          fi
          if [ "${{ github.event.inputs.skip_existing }}" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          python scraper.py $ARGS
        timeout-minutes: 30

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: logs/
          retention-days: 7
