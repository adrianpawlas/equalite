name: Equalite Scraper

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of products to scrape (leave empty for all)
        required: false
        type: string
        default: ''
      skip_embeddings:
        description: Skip image/text embeddings (faster)
        required: false
        type: boolean
        default: false
      skip_existing:
        description: Only scrape products not already in database
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 13 * * 6'

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download SigLIP model (warm cache)
        run: |
          python3 -c "from transformers import AutoModel, AutoProcessor; AutoModel.from_pretrained('google/siglip-base-patch16-384'); AutoProcessor.from_pretrained('google/siglip-base-patch16-384'); print('model ready')"

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.skip_embeddings }}" = "true" ]; then
            ARGS="$ARGS --skip-embeddings"
          fi
          if [ "${{ github.event.inputs.skip_existing }}" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          python3 scraper.py $ARGS
        timeout-minutes: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: logs/
          retention-days: 7
